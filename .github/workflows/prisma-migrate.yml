name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Code Review
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const { execSync } = require("child_process");

            if (!process.env.OPENAI_API_KEY) {
              core.setFailed("OPENAI_API_KEY secret is missing.");
              return;
            }

            const pr = context.payload.pull_request;

            const diff = execSync(
              `git diff origin/${pr.base.ref}...origin/${pr.head.ref}`,
              { encoding: "utf8", maxBuffer: 10 * 1024 * 1024 }
            );

            if (!diff.trim()) {
              console.log("No code changes found.");
              return;
            }

            const prompt = `
You are reviewing a software pull request for the TruxPylot application.

Repository:
${context.repo.owner}/${context.repo.repo}

Pull Request:
#${pr.number} - ${pr.title}

Review the code changes carefully.

Focus on:
1. Bugs and logic errors
2. Security vulnerabilities
3. Authentication and authorization problems
4. Database/Prisma problems
5. Payment/Paystack risks
6. API and server-side issues
7. Secrets or sensitive information accidentally exposed
8. Breaking changes
9. Performance problems
10. TypeScript/Next.js problems
11. Problems that could cause production deployment failures

Important:
- Do not rewrite working code unnecessarily.
- Do not suggest changes merely because you prefer another coding style.
- Give specific explanations.
- Prioritize real problems over minor style issues.
- If everything looks good, clearly say so.

Return your review using this structure:

## Summary
Short summary of the changes.

## Critical Issues
Only serious problems that should be fixed.

## Important Issues
Problems that should be addressed but are not critical.

## Suggestions
Optional improvements.

## Security
Security-related findings.

## Verdict
State whether the PR appears safe to merge based only on the code you reviewed.
Do not make assumptions about code that is not included in the diff.

Here is the pull request diff:

${diff}
`;

            const response = await fetch(
              "https://api.openai.com/v1/chat/completions",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Bearer ${process.env.OPENAI_API_KEY}`
                },
                body: JSON.stringify({
                  model: "gpt-4.1-mini",
                  temperature: 0.1,
                  messages: [
                    {
                      role: "system",
                      content:
                        "You are a careful senior software engineer performing a production code review."
                    },
                    {
                      role: "user",
                      content: prompt
                    }
                  ]
                })
              }
            );

            if (!response.ok) {
              const errorText = await response.text();
              core.setFailed(
                `OpenAI API request failed: ${response.status} ${errorText}`
              );
              return;
            }

            const data = await response.json();

            const review =
              data.choices?.[0]?.message?.content ||
              "AI review returned no content.";

            const body = `## 🤖 AI Code Review

${review}

---
*Automated review generated by GitHub Actions.*
`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body
            });
