name: TruxPylot AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI Code Review
        uses: actions/github-script@v7
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require("child_process");

            if (!process.env.OPENAI_API_KEY) {
              core.setFailed("OPENAI_API_KEY secret is not configured.");
              return;
            }

            const pr = context.payload.pull_request;

            if (!pr) {
              core.setFailed("This workflow must run on a pull request.");
              return;
            }

            const diff = execSync(
              `git diff origin/${pr.base.ref}...origin/${pr.head.ref}`,
              {
                encoding: "utf8",
                maxBuffer: 10 * 1024 * 1024
              }
            );

            if (!diff.trim()) {
              console.log("No code changes found in the pull request.");
              return;
            }

            const prompt = `
You are reviewing a pull request for the TruxPylot application.

Review the code changes carefully.

Focus on:

1. Bugs and logic errors
2. Security vulnerabilities
3. Authentication and authorization problems
4. Database and Prisma problems
5. Payment and financial risks
6. API and server-side problems
7. Input validation problems
8. Error handling
9. Performance problems
10. Breaking changes
11. Problems that could cause production deployment failures

Important:

- Do not rewrite working code unnecessarily.
- Do not suggest changes merely because you prefer another coding style.
- Give specific explanations.
- Prioritize real problems over stylistic preferences.
- Do not make assumptions about code that is not included in the diff.

Return your review using this structure:

## Summary

Short summary of the changes.

## Critical Issues

Only serious problems that should be fixed.

## Important Issues

Problems that should be addressed but are not critical.

## Suggestions

Optional improvements.

## Security

Security-related findings.

## Verdict

State whether the PR appears safe to merge based only on the code you reviewed.

Here is the pull request diff:

${diff}
`;

            const response = await fetch("https://api.openai.com/v1/chat/completions", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${process.env.OPENAI_API_KEY}`
              },
              body: JSON.stringify({
                model: "gpt-4o-mini",
                messages: [
                  {
                    role: "system",
                    content: "You are a careful senior software engineer performing code review."
                  },
                  {
                    role: "user",
                    content: prompt
                  }
                ],
                temperature: 0.2
              })
            });

            if (!response.ok) {
              const errorText = await response.text();

              core.setFailed(
                `OpenAI API request failed: ${response.status} ${errorText}`
              );

              return;
            }

            const data = await response.json();

            const review =
              data.choices?.[0]?.message?.content ||
              "AI review returned no content.";

            const body = `## 🤖 TruxPylot AI Code Review

${review}

---

*Automated review generated by GitHub Actions.*
`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body
            });
