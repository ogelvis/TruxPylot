name: TruxPylot AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: AI Review
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get pull request diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr.diff

      - name: Run TruxPylot AI Code Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const diff = fs.readFileSync("pr.diff", "utf8");

          if (!diff.trim()) {
            console.log("No changes found in the pull request.");
            process.exit(0);
          }

          const prompt = `
You are a senior software engineer reviewing a pull request for the TruxPylot application.

Review ONLY the code contained in this pull request diff.

Focus on:

1. Bugs and logic errors
2. Security vulnerabilities
3. Authentication and authorization problems
4. Database and Prisma problems
5. Payment and financial risks
6. API and server-side problems
7. Input validation problems
8. Error handling
9. Performance problems
10. Breaking changes
11. Production deployment failures

Important:

- Do not rewrite working code unnecessarily.
- Do not suggest changes merely because you prefer another coding style.
- Give specific explanations.
- Prioritize real problems over stylistic preferences.
- Do not make assumptions about code that is not included in the diff.

Return the review using exactly this structure:

## Summary

Short summary of the changes.

## Critical Issues

Only serious problems that should be fixed.

## Important Issues

Problems that should be addressed but are not critical.

## Suggestions

Optional improvements.

## Security

Security-related findings.

## Verdict

State whether the PR appears safe to merge based only on the code reviewed.

Here is the pull request diff:

${diff}
`;

          async function main() {
            const response = await fetch(
              "https://api.openai.com/v1/chat/completions",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Bearer ${process.env.OPENAI_API_KEY}`
                },
                body: JSON.stringify({
                  model: "gpt-4o-mini",
                  messages: [
                    {
                      role: "system",
                      content:
                        "You are a careful senior software engineer performing code review."
                    },
                    {
                      role: "user",
                      content: prompt
                    }
                  ],
                  temperature: 0.2
                })
              }
            );

            if (!response.ok) {
              const errorText = await response.text();
              throw new Error(
                `OpenAI API request failed: ${response.status} ${errorText}`
              );
            }

            const data = await response.json();

            const review =
              data.choices?.[0]?.message?.content ||
              "AI review returned no content.";

            fs.writeFileSync("ai-review.md", review);

            console.log(review);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Post AI review to pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## 🤖 TruxPylot AI Code Review"
            echo
            cat ai-review.md
            echo
            echo "---"
            echo
            echo "*Automated review generated by GitHub Actions.*"
          } > review-comment.md

          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file review-comment.md