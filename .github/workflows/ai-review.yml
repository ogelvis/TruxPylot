name: TruxPylot AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: AI Review
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get pull request diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr.diff

      - name: Check diff size
        run: |
          echo "PR diff size:"
          wc -c pr.diff

      - name: Run TruxPylot Claude Code Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const diff = fs.readFileSync("pr.diff", "utf8");

          if (!diff.trim()) {
            console.log("No changes found in the pull request.");
            process.exit(0);
          }

          const prompt = `
          You are a senior software engineer reviewing a pull request for the TruxPylot application.

          Review ONLY the code contained in this pull request diff.

          Focus on:

          1. Bugs and logic errors
          2. Security vulnerabilities
          3. Authentication and authorization problems
          4. Database and Prisma problems
          5. Payment and financial risks
          6. API and server-side problems
          7. Input validation problems
          8. Error handling
          9. Performance problems
          10. Breaking changes
          11. Production deployment failures

          Important:

          - Do not rewrite working code unnecessarily.
          - Do not suggest changes merely because you prefer another coding style.
          - Give specific explanations.
          - Prioritize real problems over stylistic preferences.
          - Do not make assumptions about code that is not included in the diff.
          - Pay special attention to anything that could break existing TruxPylot functionality.

          Return the review using exactly this structure:

          ## Summary

          Short summary of the changes.

          ## Critical Issues

          Only serious problems that should be fixed.

          ## Important Issues

          Problems that should be addressed but are not critical.

          ## Suggestions

          Optional improvements.

          ## Security

          Security-related findings.

          ## Verdict

          State whether the PR appears safe to merge based only on the code reviewed.

          Here is the pull request diff:

          ${diff}
          `;

          async function main() {
            const response = await fetch(
              "https://api.anthropic.com/v1/messages",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "x-api-key": process.env.ANTHROPIC_API_KEY,
                  "anthropic-version": "2023-06-01"
                },
                body: JSON.stringify({
                  model: "claude-sonnet-5",
                  max_tokens: 4096,
                  messages: [
                    {
                      role: "user",
                      content: prompt
                    }
                  ]
                })
              }
            );

            if (!response.ok) {
              const errorText = await response.text();

              throw new Error(
                `Anthropic API request failed: ${response.status} ${errorText}`
              );
            }

            const data = await response.json();

            const review =
              data.content
                ?.filter((item) => item.type === "text")
                ?.map((item) => item.text)
                ?.join("\n") ||
              "Claude returned no review.";

            fs.writeFileSync("ai-review.md", review);

            console.log(review);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Post AI review to pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## TruxPylot Claude AI Code Review"
            echo
            cat ai-review.md
            echo
            echo "---"
            echo
            echo "*Automated review generated by Claude via GitHub Actions.*"
          } > review-comment.md

          gh pr comment ${{ github.event.pull_request.number }} \
            --body-file review-comment.md